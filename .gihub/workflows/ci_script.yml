steps:
  - uses: actions/checkout@v4

  - name: Checkout app
    uses: actions/checkout@v4
    with:
      repository: cypress-io/cypress-heroes
      path: app

  - name: Install app deps
    run: |
      cd app
      npm install
      npm run setup

  - name: Start app
    run: |
      cd app
      npm run dev

  - name: Wait app
    run: npx wait-on http://localhost:3000

  - name: Install test deps
    run: npm install

  - name: Run tests
    run: npx cypress run
